name: CI

on:
  push:
    branches:
      - main
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ci"
          cache-on-failure: true

      - name: Fmt
        run: cargo fmt --all -- --check

      - name: Check
        run: cargo check --all-targets --locked

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      # reconcile.py reads packaging/deb.toml with tomllib (Python 3.11+); the
      # ubuntu-22.04 runner image ships 3.10.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Reconcile
        run: python3 reconcile.py

  # WIN-001: the workspace must build, lint and test clean for Windows. Every
  # not-yet-ported Windows arm returns an explicit error. The config ACL tests
  # (WIN-021/022) need an elevated token, which GitHub's Windows runners have.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ci-windows"
          cache-on-failure: true

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Build
        run: cargo build --locked

      - name: Test (includes the WIN-002 stack reserve check)
        run: cargo test --workspace --locked
