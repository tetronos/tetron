[package]
name = "tetron-proto"
version = "0.15.7"
edition = "2024"
rust-version = "1.91"
authors = ["Dario", "ErikAllanKincaid"]
license = "MPL-2.0"
description = "Shared IPC wire protocol for the tetron daemon/CLI and frontends"
repository = "https://github.com/tetronos/tetron"

# Shared wire protocol between the `tetron` daemon/CLI and GUI frontends.
# Holds the IPC message enum + msgpack codec and the small enums those
# messages reference. Intentionally light on dependencies so frontends
# (e.g. the Tauri UI) don't pull in the daemon's TUN/DNS/blob stack.

[dependencies]
anyhow = "1"
blake3 = "1"
bs58 = "0.5.1"
bytes = "1"
derive_more = { version = "2", features = ["is_variant", "display"] }
futures = "0.3"
iroh = { version = "1" }
rmp-serde = "1"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["net"] }
tokio-util = { version = "0.7", features = ["codec"] }

[target.'cfg(windows)'.dependencies]
# Named-pipe client: exact access rights and the pipe owner check (WIN-031).
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
] }

[dev-dependencies]
rand = "0.10"
